<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.75" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#573a21"/>
      <stop offset="40%" stop-color="#3d2614"/>
      <stop offset="100%" stop-color="#241408"/>
    </linearGradient>
    
    <!-- Tank Metal Gradients -->
    <linearGradient id="tankBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="40%" stop-color="#3f6212"/>
      <stop offset="80%" stop-color="#1a2e05"/>
    </linearGradient>
    <linearGradient id="tankHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#3f6212"/>
    </linearGradient>
    <linearGradient id="tankArmorDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    
    <!-- Explosion & Muzzle Flash -->
    <radialGradient id="muzzleFlash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>
  <rect width="800" height="450" fill="url(#sunGlow)"/>

  <!-- Distant War Clouds / Mountains -->
  <path d="M0 260 L80 230 L180 250 L260 215 L360 245 L480 205 L600 240 L710 220 L800 250 L800 350 L0 350 Z" fill="#2d1c14" opacity="0.8"/>
  <path d="M0 280 L120 255 L240 275 L380 240 L510 270 L650 245 L800 275 L800 380 L0 380 Z" fill="#3d2614" opacity="0.9"/>

  <!-- Dramatic Smoke Plumes -->
  <ellipse cx="680" cy="190" rx="90" ry="60" fill="#18181b" opacity="0.4" filter="url(#glow)"/>
  <ellipse cx="710" cy="150" rx="60" ry="40" fill="#27272a" opacity="0.3" filter="url(#glow)"/>

  <!-- Battlefield Ground -->
  <path d="M0 320 Q200 300 400 320 T800 310 L800 450 L0 450 Z" fill="url(#groundGrad)"/>
  
  <!-- Tank Tracks Shadow -->
  <ellipse cx="380" cy="415" rx="270" ry="25" fill="#000000" opacity="0.7" filter="url(#dropShadow)"/>

  <!-- BATTLE TANK GROUP -->
  <g transform="translate(140, 160)" filter="url(#dropShadow)">
    
    <!-- Left Treads & Wheels -->
    <rect x="50" y="195" width="380" height="45" rx="20" fill="url(#tankArmorDark)" stroke="#52525b" stroke-width="4"/>
    <!-- Wheels -->
    <circle cx="85" cy="217" r="16" fill="#71717a" stroke="#27272a" stroke-width="4"/>
    <circle cx="140" cy="217" r="16" fill="#71717a" stroke="#27272a" stroke-width="4"/>
    <circle cx="195" cy="217" r="16" fill="#71717a" stroke="#27272a" stroke-width="4"/>
    <circle cx="250" cy="217" r="16" fill="#71717a" stroke="#27272a" stroke-width="4"/>
    <circle cx="305" cy="217" r="16" fill="#71717a" stroke="#27272a" stroke-width="4"/>
    <circle cx="360" cy="217" r="16" fill="#71717a" stroke="#27272a" stroke-width="4"/>
    <circle cx="410" cy="217" r="12" fill="#52525b" stroke="#27272a" stroke-width="3"/>

    <!-- Track Tread Ribs -->
    <path d="M70 195 L70 240 M120 195 L120 240 M175 195 L175 240 M230 195 L230 240 M285 195 L285 240 M340 195 L340 240 M395 195 L395 240" stroke="#18181b" stroke-width="3"/>

    <!-- Lower Chassis Skirt -->
    <polygon points="60,195 420,195 440,165 40,165" fill="#365314" stroke="#1a2e05" stroke-width="3"/>
    
    <!-- Main Hull Body -->
    <polygon points="50,165 430,165 405,120 80,120" fill="url(#tankBody)" stroke="#1a2e05" stroke-width="4"/>
    <polygon points="85,125 400,125 390,135 95,135" fill="url(#tankHighlight)" opacity="0.6"/>

    <!-- Armor Rivets & Plates -->
    <circle cx="100" cy="145" r="3" fill="#bef264"/>
    <circle cx="130" cy="145" r="3" fill="#bef264"/>
    <circle cx="360" cy="145" r="3" fill="#bef264"/>
    <circle cx="390" cy="145" r="3" fill="#bef264"/>

    <!-- Cannon Barrel (Aiming Right Upward) -->
    <g transform="rotate(-7, 260, 95)">
      <!-- Cannon Tube -->
      <polygon points="260,86 490,82 490,102 260,106" fill="url(#tankArmorDark)" stroke="#18181b" stroke-width="3"/>
      <!-- Muzzle Brake -->
      <rect x="490" y="78" width="28" height="28" rx="4" fill="#3f3f46" stroke="#18181b" stroke-width="3"/>
      
      <!-- MUZZLE EXPLOSION FLASH -->
      <g transform="translate(520, 92)" filter="url(#glow)">
        <polygon points="0,0 70,-45 40,-15 110,-20 55,5 125,25 45,20 85,55 20,25 0,70 -15,20 -40,40 -25,0 -50,-25 -10,-15" fill="url(#muzzleFlash)"/>
        <circle cx="20" cy="0" r="35" fill="url(#muzzleFlash)"/>
        <circle cx="15" cy="0" r="16" fill="#ffffff"/>
      </g>
    </g>

    <!-- Turret Cupola -->
    <path d="M160 120 C160 80 200 65 260 65 C320 65 350 80 350 120 Z" fill="url(#tankBody)" stroke="#1a2e05" stroke-width="4"/>
    <ellipse cx="255" cy="78" rx="75" ry="12" fill="url(#tankHighlight)" opacity="0.5"/>
    
    <!-- Commander Hatch -->
    <ellipse cx="220" cy="72" rx="28" ry="9" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    <!-- Periscope / Antenna -->
    <rect x="290" y="48" width="12" height="20" rx="3" fill="#334155" stroke="#0f172a" stroke-width="2"/>
    <line x1="190" y1="70" x2="170" y2="10" stroke="#facc15" stroke-width="2"/>
    <circle cx="170" cy="10" r="3" fill="#facc15"/>
  </g>

  <!-- Flying Spark Particles -->
  <circle cx="680" cy="220" r="4" fill="#fef08a" filter="url(#glow)"/>
  <circle cx="730" cy="250" r="3" fill="#f97316" filter="url(#glow)"/>
  <circle cx="640" cy="290" r="5" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="590" cy="200" r="3" fill="#fef08a" filter="url(#glow)"/>
  <circle cx="750" cy="180" r="4" fill="#facc15" filter="url(#glow)"/>
</svg>
