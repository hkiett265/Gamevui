<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <radialGradient id="neonCyanGlow" cx="0.2" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="0.8" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="controllerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glowFilt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadowFilt" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="600" height="240" rx="16" fill="url(#bgGrad2)"/>
  <rect width="600" height="240" fill="url(#neonCyanGlow)"/>
  <rect width="600" height="240" fill="url(#purpleGlow)"/>

  <!-- Glowing Neon Gamepad Icon on Left -->
  <g transform="translate(45, 55)" filter="url(#glowFilt)">
    <!-- Controller Body -->
    <path d="M25 40 C10 40 0 55 5 80 C10 100 25 110 45 105 C60 100 70 85 85 85 C100 85 110 100 125 105 C145 110 160 100 165 80 C170 55 160 40 145 40 C125 40 105 50 85 50 C65 50 45 40 25 40 Z" fill="url(#controllerGrad)" stroke="#7dd3fc" stroke-width="4"/>
    <!-- D-Pad -->
    <path d="M42 55 h12 v-10 h10 v10 h12 v10 h-12 v10 h-10 v-10 h-12 z" fill="#0f172a"/>
    <!-- Action Buttons -->
    <circle cx="120" cy="55" r="5" fill="#f43f5e"/>
    <circle cx="132" cy="65" r="5" fill="#eab308"/>
    <circle cx="108" cy="65" r="5" fill="#10b981"/>
    <circle cx="120" cy="75" r="5" fill="#3b82f6"/>
    <!-- Thumbsticks -->
    <circle cx="68" cy="75" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="102" cy="75" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Two Cartoon Kids Playing Together on Right -->
  <g transform="translate(380, 50)" filter="url(#shadowFilt)">
    <!-- Kid 1 (Left - Cap on backwards) -->
    <g transform="translate(0, 15)">
      <!-- Body / Hoodie -->
      <path d="M25 90 C25 65 85 65 85 90 L90 140 L20 140 Z" fill="#3b82f6"/>
      <!-- Head -->
      <circle cx="55" cy="45" r="30" fill="#fed7aa"/>
      <!-- Hair & Cap -->
      <path d="M25 42 C25 20 85 20 85 42 Z" fill="#ef4444"/>
      <rect x="75" y="36" width="22" height="8" rx="4" fill="#dc2626"/>
      <!-- Smiling Face -->
      <circle cx="48" cy="45" r="3.5" fill="#1e293b"/>
      <circle cx="68" cy="45" r="3.5" fill="#1e293b"/>
      <path d="M52 56 Q58 64 64 56" stroke="#ea580c" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Cheeks -->
      <circle cx="42" cy="52" r="4" fill="#fca5a5" opacity="0.6"/>
      <circle cx="74" cy="52" r="4" fill="#fca5a5" opacity="0.6"/>
      <!-- Arms holding Mini Controller -->
      <path d="M30 95 Q55 115 80 95" stroke="#fed7aa" stroke-width="12" fill="none" stroke-linecap="round"/>
      <rect x="42" y="100" width="30" height="18" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    </g>

    <!-- Kid 2 (Right - Cute dark hair) -->
    <g transform="translate(80, 15)">
      <!-- Body / Hoodie -->
      <path d="M25 90 C25 65 85 65 85 90 L90 140 L20 140 Z" fill="#ec4899"/>
      <!-- Head -->
      <circle cx="55" cy="45" r="30" fill="#fde68a"/>
      <!-- Dark Hair -->
      <path d="M25 42 C25 15 85 15 85 42 C85 30 70 25 55 25 C40 25 25 30 25 42 Z" fill="#1e293b"/>
      <!-- Cute Eyes & Big Smile -->
      <ellipse cx="46" cy="45" rx="3.5" ry="4" fill="#1e293b"/>
      <ellipse cx="66" cy="45" rx="3.5" ry="4" fill="#1e293b"/>
      <path d="M49 55 Q56 65 63 55" stroke="#e11d48" stroke-width="3" fill="#ffffff" stroke-linecap="round"/>
      <!-- Cheeks -->
      <circle cx="40" cy="52" r="4" fill="#f472b6" opacity="0.6"/>
      <circle cx="72" cy="52" r="4" fill="#f472b6" opacity="0.6"/>
      <!-- Arms holding Mini Controller -->
      <path d="M30 95 Q55 115 80 95" stroke="#fde68a" stroke-width="12" fill="none" stroke-linecap="round"/>
      <rect x="42" y="100" width="30" height="18" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    </g>
  </g>
</svg>
